[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calculator-mcp"
version = "1.0.0"
description = "A basic calculator MCP server with configurable data type support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "niravndroid-creator", email = "niravndroid@users.noreply.github.com"}
]
keywords = ["mcp", "calculator", "server", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
calculator-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/niravndroid-creator/calculator_mcp"
Repository = "https://github.com/niravndroid-creator/calculator_mcp"
Issues = "https://github.com/niravndroid-creator/calculator_mcp/issues"

# MCP Server Configuration (following MCP convention)
[tool.mcp.config]
type = "object"

[tool.mcp.config.properties.data_types]
type = "string"
enum = ["integer", "decimal", "both"]
default = "both"
description = "Supported data types for calculations"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
